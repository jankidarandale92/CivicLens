services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civiclens-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: civiclens-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped